name: npm publish

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (the package will not be published)'
        default: false
        type: boolean
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        default: ''
        type: string
      tag:
        description: 'npm dist-tag (e.g., latest, nightly)'
        default: ''
        type: string

jobs:
  npm-publish:
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/publish-npm.yml@a69a25679b7d47df1256596f1fc9df0fdc38a8a8 # publish-npm-v1.7.1
    with:
      install-command: npm ci
      build-command: npm run build
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      environment: ${{ (!inputs.dry-run && inputs.tag) || '' }}
      provenance: ${{ !inputs.dry-run }}
