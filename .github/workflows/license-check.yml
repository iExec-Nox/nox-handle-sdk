name: License check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-license-check
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check licenses
        run: npx license-checker@25.0.1 --onlyAllow 'MIT'
